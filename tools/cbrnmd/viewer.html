<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OBJ Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font:11px/1.4 'Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden}
#canvas-container{position:absolute;inset:0;z-index:0}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:0;right:0;width:300px;height:100%;z-index:10;display:flex;flex-direction:column;background:rgba(0,0,0,.85);border-left:1px solid #222}
#ui-header{padding:10px 12px;border-bottom:1px solid #222}
#ui-header h1{font-size:12px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:#888}
#stats-bar{padding:6px 12px;border-bottom:1px solid #222;font-size:9px;color:#555;line-height:1.6}
#stats-bar span{color:#888}
#controls{padding:8px 12px;border-bottom:1px solid #222;display:flex;flex-direction:column;gap:4px}
#controls label{display:block;cursor:pointer;padding:4px 8px;border:1px solid #333;font-size:10px;text-align:center;text-transform:uppercase;letter-spacing:.3px;transition:border-color .15s}
#controls label:hover{border-color:#666}
#controls input[type=file]{display:none}
#drop-zone{padding:10px;border-bottom:1px solid #222;text-align:center;color:#444;font-size:10px;text-transform:uppercase;letter-spacing:.3px}
#drop-zone.drag-over{color:#fff;background:rgba(255,255,255,.05)}
#model-selector{border-bottom:1px solid #222;max-height:160px;overflow-y:auto;display:none}
#model-selector::-webkit-scrollbar{width:4px}
#model-selector::-webkit-scrollbar-thumb{background:#333}
#model-selector .model-header{padding:6px 12px;font-size:9px;color:#555;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid #111}
.model-entry{padding:4px 8px 4px 12px;border-bottom:1px solid #111;display:flex;align-items:center;gap:6px;cursor:pointer}
.model-entry:hover{background:rgba(255,255,255,.03)}
.model-entry.active{background:rgba(255,255,255,.07);border-left:2px solid #888}
.model-entry .model-name{font-size:10px;color:#ccc;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-entry .model-meta{font-size:8px;color:#555}
#view-mode{padding:6px 12px;border-bottom:1px solid #222;display:none}
#view-mode .btn-row{display:flex;gap:4px}
#view-mode button{flex:1;padding:4px 8px}
#view-mode button.active-mode{border-color:#888;color:#fff}
#mesh-list{flex:1;overflow-y:auto;padding:4px 0}
#mesh-list::-webkit-scrollbar{width:4px}
#mesh-list::-webkit-scrollbar-thumb{background:#333}
.mesh-item{padding:3px 8px 3px 12px;border-bottom:1px solid #111;display:flex;align-items:center;gap:6px}
.mesh-item:hover{background:rgba(255,255,255,.03)}
.mesh-swatch{width:10px;height:10px;flex-shrink:0;border:1px solid #333}
.mesh-info{flex:1;min-width:0}
.mesh-name{font-size:10px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mesh-stats{font-size:9px;color:#555}
.mesh-item input[type=checkbox]{accent-color:#fff;cursor:pointer}
.mesh-tex-tag{font-size:8px;color:#555;border:1px solid #333;padding:0 3px;letter-spacing:.3px;flex-shrink:0}
.mesh-tex-tag.has-tex{color:#888;border-color:#555}
.btn-remove{background:none;border:1px solid #333;color:#555;font:9px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;padding:2px 5px;cursor:pointer;flex-shrink:0;transition:all .15s}
.btn-remove:hover{border-color:#888;color:#fff;background:rgba(255,255,255,.05)}
#status{padding:8px 12px;border-top:1px solid #222;color:#444;font-size:9px}
.btn-row{display:flex;gap:4px}
.btn-row label,.btn-row button{flex:1}
button{background:none;border:1px solid #333;color:#888;font:10px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;padding:4px 8px;cursor:pointer;text-transform:uppercase;letter-spacing:.3px;transition:border-color .15s}
button:hover{border-color:#666;color:#ccc}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="ui">
  <div id="ui-header"><h1>OBJ Viewer</h1></div>
  <div id="stats-bar">
    Meshes: <span id="stat-meshes">0 / 0</span> |
    V: <span id="stat-verts">0</span> |
    F: <span id="stat-faces">0</span> |
    Tex: <span id="stat-tex">0</span>
  </div>
  <div id="controls">
    <div class="btn-row">
      <label>Load files<input type="file" id="file-input" multiple accept=".obj,.mtl,.png,.jpg,.jpeg,.tga,.bmp"></label>
      <label>Load folder<input type="file" id="folder-input" webkitdirectory></label>
    </div>
    <div class="btn-row">
      <button id="btn-clear">Clear all</button>
      <button id="btn-show-all">Show all</button>
      <button id="btn-hide-all">Hide all</button>
    </div>
    <div class="btn-row">
      <button id="btn-center">Center</button>
      <button id="btn-wireframe">Wire: off</button>
    </div>
    <div class="btn-row">
      <button id="btn-export">Export visible</button>
      <button id="btn-export-clip">Copy visible</button>
    </div>
  </div>
  <div id="drop-zone">Drop .obj / .mtl / textures or model folder</div>
  <div id="model-selector">
    <div class="model-header">Models</div>
    <div id="model-list"></div>
  </div>
  <div id="view-mode">
    <div class="btn-row">
      <button id="btn-mode-full" class="active-mode">Full mesh</button>
      <button id="btn-mode-parts">Parts</button>
    </div>
  </div>
  <div id="mesh-list"></div>
  <div id="status">Ready</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

const container = document.getElementById('canvas-container');
const meshListEl = document.getElementById('mesh-list');
const statusEl = document.getElementById('status');
const fileInput = document.getElementById('file-input');
const folderInput = document.getElementById('folder-input');
const dropZone = document.getElementById('drop-zone');
const modelSelectorEl = document.getElementById('model-selector');
const modelListEl = document.getElementById('model-list');
const viewModeEl = document.getElementById('view-mode');

// palette
const PALETTE = [
  0xcc4444, 0x44aa44, 0x4488cc, 0xccaa33, 0xaa44aa,
  0x44aaaa, 0xcc7733, 0x7744cc, 0x44cc77, 0xcc4488,
  0x88cc44, 0x4444cc, 0xaaaa44, 0xcc8888, 0x88cccc,
  0xcc88cc, 0x88cc88, 0x7799aa, 0xaa7799, 0x99aa77
];
let colorIdx = 0;
function nextColor() { return PALETTE[colorIdx++ % PALETTE.length]; }

// renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000);
container.appendChild(renderer.domElement);

// scene
const scene = new THREE.Scene();

// camera
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
camera.position.set(2, 2, 3);

// controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// lights
const amb = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(amb);
const dir1 = new THREE.DirectionalLight(0xffffff, 0.8);
dir1.position.set(3, 5, 4);
scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.3);
dir2.position.set(-3, 2, -2);
scene.add(dir2);

// grid
const grid = new THREE.GridHelper(20, 40, 0x222222, 0x111111);
scene.add(grid);

// state
const meshEntries = []; // { name, mesh, checkbox, color, vCount, fCount, hasTexture, uiEl, group }
let wireframeOn = false;

// Model folder state
const loadedModels = []; // { name, manifest, files, fullEntries:[], partEntries:[], activeMode:'full' }
let activeModel = null;

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// center camera on all visible meshes
function centerCamera() {
  const box = new THREE.Box3();
  let any = false;
  for (const e of meshEntries) {
    if (e.mesh.visible) {
      box.expandByObject(e.mesh);
      any = true;
    }
  }
  if (!any) return;
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(size * 0.6, size * 0.5, size * 0.8));
  controls.update();
}

function materialHasTexture(mat) {
  if (!mat) return false;
  if (mat.map || mat.normalMap || mat.specularMap || mat.bumpMap || mat.aoMap || mat.emissiveMap) return true;
  return false;
}

// add a loaded OBJ group to scene
function addOBJGroup(group, fileName, hasMtlMaterials, modelRef) {
  const children = [];
  group.traverse(child => { if (child.isMesh) children.push(child); });

  const entries = [];
  for (const child of children) {
    const hasTex = hasMtlMaterials && materialHasTexture(child.material);
    let color;

    if (hasMtlMaterials && child.material) {
      if (Array.isArray(child.material)) {
        child.material.forEach(m => {
          m.side = THREE.DoubleSide;
          m.wireframe = wireframeOn;
        });
      } else {
        child.material.side = THREE.DoubleSide;
        child.material.wireframe = wireframeOn;
      }
      const mat = Array.isArray(child.material) ? child.material[0] : child.material;
      color = mat.color ? mat.color.getHex() : nextColor();
    } else {
      color = nextColor();
      child.material = new THREE.MeshStandardMaterial({
        color,
        wireframe: wireframeOn,
        flatShading: true,
        roughness: 0.7,
        metalness: 0.1,
        side: THREE.DoubleSide
      });
    }

    const geo = child.geometry;
    const vCount = geo.attributes.position ? geo.attributes.position.count : 0;
    const idx = geo.index;
    const fCount = idx ? idx.count / 3 : vCount / 3;

    const name = fileName + (children.length > 1 ? ` [${child.name || meshEntries.length}]` : '');
    scene.add(child);

    const entry = { name, mesh: child, color, vCount, fCount: Math.floor(fCount), hasTexture: hasTex, group: modelRef || null };
    meshEntries.push(entry);
    addMeshUI(entry);
    entries.push(entry);
  }
  centerCamera();
  updateStats();
  return entries;
}

function removeMeshEntry(entry) {
  scene.remove(entry.mesh);
  if (entry.mesh.geometry) entry.mesh.geometry.dispose();
  if (entry.mesh.material) {
    const mats = Array.isArray(entry.mesh.material) ? entry.mesh.material : [entry.mesh.material];
    for (const m of mats) {
      if (m.map) m.map.dispose();
      if (m.normalMap) m.normalMap.dispose();
      if (m.specularMap) m.specularMap.dispose();
      if (m.bumpMap) m.bumpMap.dispose();
      m.dispose();
    }
  }
  const idx = meshEntries.indexOf(entry);
  if (idx !== -1) meshEntries.splice(idx, 1);
  if (entry.uiEl && entry.uiEl.parentNode) {
    entry.uiEl.parentNode.removeChild(entry.uiEl);
  }
  // Remove from model tracking
  if (entry.group) {
    const model = entry.group;
    model.fullEntries = model.fullEntries.filter(e => e !== entry);
    model.partEntries = model.partEntries.filter(e => e !== entry);
  }
  updateStats();
}

function addMeshUI(entry) {
  const div = document.createElement('div');
  div.className = 'mesh-item';
  entry.uiEl = div;

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = entry.mesh.visible;
  cb.addEventListener('change', () => {
    entry.mesh.visible = cb.checked;
    updateStats();
  });
  entry.checkbox = cb;

  const swatch = document.createElement('div');
  swatch.className = 'mesh-swatch';
  swatch.style.background = '#' + entry.color.toString(16).padStart(6, '0');

  const info = document.createElement('div');
  info.className = 'mesh-info';
  info.innerHTML = `<div class="mesh-name">${entry.name}</div><div class="mesh-stats">V:${entry.vCount} F:${entry.fCount}</div>`;

  const texTag = document.createElement('div');
  texTag.className = 'mesh-tex-tag' + (entry.hasTexture ? ' has-tex' : '');
  texTag.textContent = entry.hasTexture ? 'TEX' : '---';

  const btnRemove = document.createElement('button');
  btnRemove.className = 'btn-remove';
  btnRemove.textContent = 'X';
  btnRemove.title = 'Remove mesh';
  btnRemove.addEventListener('click', (e) => {
    e.stopPropagation();
    removeMeshEntry(entry);
  });

  div.appendChild(cb);
  div.appendChild(swatch);
  div.appendChild(info);
  div.appendChild(texTag);
  div.appendChild(btnRemove);
  meshListEl.appendChild(div);
}

function updateStats() {
  const total = meshEntries.length;
  const vis = meshEntries.filter(e => e.mesh.visible).length;
  const totalV = meshEntries.reduce((s, e) => s + e.vCount, 0);
  const totalF = meshEntries.reduce((s, e) => s + e.fCount, 0);
  const texCount = meshEntries.filter(e => e.hasTexture).length;

  document.getElementById('stat-meshes').textContent = `${vis} / ${total}`;
  document.getElementById('stat-verts').textContent = totalV.toLocaleString();
  document.getElementById('stat-faces').textContent = totalF.toLocaleString();
  document.getElementById('stat-tex').textContent = texCount.toString();

  statusEl.textContent = `${vis}/${total} visible | V:${totalV.toLocaleString()} F:${totalF.toLocaleString()}`;
}

function getVisibleListData() {
  const visible = meshEntries.filter(e => e.mesh.visible);
  return {
    exported: new Date().toISOString(),
    totalVisible: visible.length,
    totalVerts: visible.reduce((s, e) => s + e.vCount, 0),
    totalFaces: visible.reduce((s, e) => s + e.fCount, 0),
    meshes: visible.map(e => ({
      name: e.name,
      vertices: e.vCount,
      faces: e.fCount,
      hasTexture: e.hasTexture
    }))
  };
}

function exportVisibleAsFile() {
  const data = getVisibleListData();
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'visible_meshes.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  statusEl.textContent = `Exported ${data.totalVisible} visible meshes`;
}

function copyVisibleToClipboard() {
  const data = getVisibleListData();
  const lines = [`Visible meshes: ${data.totalVisible}`, `Total V: ${data.totalVerts}  F: ${data.totalFaces}`, ''];
  for (const m of data.meshes) {
    lines.push(`${m.name}  V:${m.vertices}  F:${m.faces}${m.hasTexture ? '  [TEX]' : ''}`);
  }
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    statusEl.textContent = `Copied ${data.totalVisible} mesh names to clipboard`;
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    statusEl.textContent = `Copied ${data.totalVisible} mesh names to clipboard`;
  });
}

// ---- MTL parsing with texture blob URLs ----

function parseMTLFromFiles(mtlText, textureFiles) {
  const textureBlobUrls = {};
  for (const [name, file] of Object.entries(textureFiles)) {
    textureBlobUrls[name] = URL.createObjectURL(file);
  }

  const manager = new THREE.LoadingManager();
  manager.setURLModifier((url) => {
    const basename = url.split('/').pop().split('\\').pop();
    if (textureBlobUrls[basename]) return textureBlobUrls[basename];
    const lower = basename.toLowerCase();
    for (const [name, blobUrl] of Object.entries(textureBlobUrls)) {
      if (name.toLowerCase() === lower) return blobUrl;
    }
    for (const [name, blobUrl] of Object.entries(textureBlobUrls)) {
      if (url.endsWith(name) || url.endsWith(name.replace(/\\/g, '/'))) return blobUrl;
    }
    return url;
  });

  const mtlLoader = new MTLLoader(manager);
  const materials = mtlLoader.parse(mtlText, '');
  materials.preload();
  return { materials, blobUrls: textureBlobUrls };
}

function loadOBJText(text, name, mtlMaterials, modelRef) {
  const loader = new OBJLoader();
  if (mtlMaterials) {
    loader.setMaterials(mtlMaterials);
  }
  const group = loader.parse(text);
  return addOBJGroup(group, name, !!mtlMaterials, modelRef);
}

// ---- Legacy file handling (drag & drop / file picker for individual files) ----

fileInput.addEventListener('change', e => {
  handleFiles(e.target.files);
  fileInput.value = '';
});

function handleFiles(fileList) {
  const files = Array.from(fileList);
  const objFiles = files.filter(f => f.name.toLowerCase().endsWith('.obj'));
  const mtlFiles = files.filter(f => f.name.toLowerCase().endsWith('.mtl'));
  const textureFiles = {};

  const texExts = ['.png', '.jpg', '.jpeg', '.tga', '.bmp'];
  for (const f of files) {
    const lower = f.name.toLowerCase();
    if (texExts.some(ext => lower.endsWith(ext))) {
      textureFiles[f.name] = f;
    }
  }

  if (!objFiles.length) {
    statusEl.textContent = 'No .obj files found';
    return;
  }

  statusEl.textContent = `Loading ${objFiles.length} file(s)...`;

  const mtlTextMap = {};
  let mtlLoadCount = 0;
  const totalMtl = mtlFiles.length;

  function proceedWithOBJs() {
    let loaded = 0;
    for (const objFile of objFiles) {
      const reader = new FileReader();
      reader.onload = ev => {
        const objText = ev.target.result;
        let mtlMaterials = null;
        const mtlRef = objText.match(/^mtllib\s+(.+)$/m);

        if (mtlRef) {
          const mtlName = mtlRef[1].trim();
          const mtlText = mtlTextMap[mtlName] || mtlTextMap[Object.keys(mtlTextMap)[0]];
          if (mtlText && Object.keys(textureFiles).length > 0) {
            const result = parseMTLFromFiles(mtlText, textureFiles);
            mtlMaterials = result.materials;
          } else if (mtlText) {
            const mtlLoader = new MTLLoader();
            mtlMaterials = mtlLoader.parse(mtlText, '');
            mtlMaterials.preload();
          }
        } else if (totalMtl > 0) {
          const mtlText = Object.values(mtlTextMap)[0];
          if (mtlText) {
            if (Object.keys(textureFiles).length > 0) {
              const result = parseMTLFromFiles(mtlText, textureFiles);
              mtlMaterials = result.materials;
            } else {
              const mtlLoader = new MTLLoader();
              mtlMaterials = mtlLoader.parse(mtlText, '');
              mtlMaterials.preload();
            }
          }
        }

        loadOBJText(objText, objFile.name, mtlMaterials, null);
        loaded++;
        if (loaded === objFiles.length) {
          statusEl.textContent = `Loaded ${loaded} file(s)`;
          setTimeout(updateStats, 100);
        }
      };
      reader.readAsText(objFile);
    }
  }

  if (totalMtl === 0) {
    proceedWithOBJs();
  } else {
    for (const mtlFile of mtlFiles) {
      const reader = new FileReader();
      reader.onload = ev => {
        mtlTextMap[mtlFile.name] = ev.target.result;
        mtlLoadCount++;
        if (mtlLoadCount === totalMtl) {
          proceedWithOBJs();
        }
      };
      reader.readAsText(mtlFile);
    }
  }
}

// ---- Folder handling (model folders with manifest.json) ----

folderInput.addEventListener('change', e => {
  handleFolderFiles(e.target.files);
  folderInput.value = '';
});

function handleFolderFiles(fileList) {
  const files = Array.from(fileList);
  if (!files.length) return;

  // Build a file map by relative path
  const fileMap = {};
  for (const f of files) {
    // webkitRelativePath = "FolderName/subfolder/file.ext"
    const rel = f.webkitRelativePath || f.name;
    fileMap[rel] = f;
  }

  // Check if this is a single model folder (has manifest.json at top)
  // or a parent folder containing multiple model folders
  const manifestFiles = Object.keys(fileMap).filter(p => p.endsWith('/manifest.json') || p === 'manifest.json');

  if (manifestFiles.length === 0) {
    // No manifest - try as plain file drop
    statusEl.textContent = 'No manifest.json found in folder. Loading as plain files...';
    handleFiles(fileList);
    return;
  }

  statusEl.textContent = `Found ${manifestFiles.length} model(s) in folder...`;

  // For each manifest, load the model
  let loadCount = 0;
  for (const manifestPath of manifestFiles) {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const manifest = JSON.parse(ev.target.result);
        const folderPrefix = manifestPath.replace(/manifest\.json$/, '');
        loadModelFromManifest(manifest, folderPrefix, fileMap);
      } catch(e) {
        console.error('Failed to parse manifest:', manifestPath, e);
        statusEl.textContent = `Error parsing ${manifestPath}`;
      }
      loadCount++;
      if (loadCount === manifestFiles.length) {
        statusEl.textContent = `Loaded ${loadCount} model(s)`;
        updateModelSelector();
      }
    };
    reader.readAsText(fileMap[manifestPath]);
  }
}

function loadModelFromManifest(manifest, folderPrefix, fileMap) {
  const modelName = manifest.name || 'Unknown';
  statusEl.textContent = `Loading ${modelName}...`;

  // Find files relative to the manifest folder
  function getFile(relPath) {
    const fullPath = folderPrefix + relPath;
    return fileMap[fullPath] || null;
  }

  // Collect texture files
  const textureFiles = {};
  for (const texPath of (manifest.textures || [])) {
    const f = getFile(texPath);
    if (f) {
      const basename = texPath.split('/').pop();
      textureFiles[basename] = f;
    }
  }

  // Read MTL
  const mtlFile = getFile(manifest.mtl);

  // Create model tracking object
  const modelObj = {
    name: modelName,
    manifest: manifest,
    files: fileMap,
    folderPrefix: folderPrefix,
    textureFiles: textureFiles,
    fullEntries: [],
    partEntries: [],
    activeMode: 'full'
  };
  loadedModels.push(modelObj);

  // Load full OBJ
  const fullObjFile = getFile(manifest.full);
  if (!fullObjFile) {
    statusEl.textContent = `${modelName}: full OBJ not found`;
    return;
  }

  // Read MTL first, then load OBJ
  if (mtlFile) {
    const mtlReader = new FileReader();
    mtlReader.onload = mtlEv => {
      const mtlText = mtlEv.target.result;
      let mtlMaterials = null;
      if (Object.keys(textureFiles).length > 0) {
        const result = parseMTLFromFiles(mtlText, textureFiles);
        mtlMaterials = result.materials;
      } else {
        const mtlLoader = new MTLLoader();
        mtlMaterials = mtlLoader.parse(mtlText, '');
        mtlMaterials.preload();
      }

      // Load full mesh
      loadFullMesh(modelObj, fullObjFile, mtlMaterials);

      // Pre-read parts (but don't display yet)
      preloadParts(modelObj, mtlMaterials);
    };
    mtlReader.readAsText(mtlFile);
  } else {
    loadFullMesh(modelObj, fullObjFile, null);
    preloadParts(modelObj, null);
  }
}

function loadFullMesh(modelObj, fullObjFile, mtlMaterials) {
  const reader = new FileReader();
  reader.onload = ev => {
    const entries = loadOBJText(ev.target.result, `${modelObj.name} [full]`, mtlMaterials, modelObj);
    modelObj.fullEntries = entries;
    // Parts are hidden by default until mode switch
    statusEl.textContent = `${modelObj.name}: full mesh loaded`;
    updateModelSelector();
  };
  reader.readAsText(fullObjFile);
}

function preloadParts(modelObj, mtlMaterials) {
  const parts = modelObj.manifest.parts || [];
  if (!parts.length) return;

  let loaded = 0;
  for (const partPath of parts) {
    const f = modelObj.files[modelObj.folderPrefix + partPath] || null;
    if (!f) continue;

    const reader = new FileReader();
    reader.onload = ev => {
      const partName = partPath.split('/').pop().replace('.obj', '');
      const entries = loadOBJText(ev.target.result, `${modelObj.name} / ${partName}`, mtlMaterials, modelObj);
      modelObj.partEntries.push(...entries);
      // Hide parts by default (full mode is default)
      for (const e of entries) {
        e.mesh.visible = false;
        if (e.checkbox) e.checkbox.checked = false;
      }
      loaded++;
      if (loaded === parts.length) {
        updateStats();
      }
    };
    reader.readAsText(f);
  }
}

// ---- Model selector UI ----

function updateModelSelector() {
  if (loadedModels.length === 0) {
    modelSelectorEl.style.display = 'none';
    viewModeEl.style.display = 'none';
    return;
  }

  modelSelectorEl.style.display = 'block';
  viewModeEl.style.display = 'block';
  modelListEl.innerHTML = '';

  for (const model of loadedModels) {
    const div = document.createElement('div');
    div.className = 'model-entry' + (activeModel === model ? ' active' : '');

    const nameEl = document.createElement('span');
    nameEl.className = 'model-name';
    nameEl.textContent = model.name;

    const metaEl = document.createElement('span');
    metaEl.className = 'model-meta';
    const s = model.manifest.stats || {};
    metaEl.textContent = `V:${(s.total_verts||0).toLocaleString()} F:${(s.total_faces||0).toLocaleString()} P:${s.num_parts||0}`;

    div.appendChild(nameEl);
    div.appendChild(metaEl);

    div.addEventListener('click', () => {
      activeModel = model;
      applyViewMode(model);
      updateModelSelector();
    });

    modelListEl.appendChild(div);
  }
}

function applyViewMode(model) {
  if (!model) return;

  // Hide all model entries first
  for (const m of loadedModels) {
    for (const e of m.fullEntries) {
      e.mesh.visible = false;
      if (e.checkbox) e.checkbox.checked = false;
    }
    for (const e of m.partEntries) {
      e.mesh.visible = false;
      if (e.checkbox) e.checkbox.checked = false;
    }
  }

  // Show the selected model in the active mode
  if (model.activeMode === 'full') {
    for (const e of model.fullEntries) {
      e.mesh.visible = true;
      if (e.checkbox) e.checkbox.checked = true;
    }
  } else {
    for (const e of model.partEntries) {
      e.mesh.visible = true;
      if (e.checkbox) e.checkbox.checked = true;
    }
  }

  // Update mode buttons
  document.getElementById('btn-mode-full').className = model.activeMode === 'full' ? 'active-mode' : '';
  document.getElementById('btn-mode-parts').className = model.activeMode === 'parts' ? 'active-mode' : '';

  updateStats();
  centerCamera();
}

document.getElementById('btn-mode-full').addEventListener('click', () => {
  if (activeModel) {
    activeModel.activeMode = 'full';
    applyViewMode(activeModel);
    updateModelSelector();
  }
});

document.getElementById('btn-mode-parts').addEventListener('click', () => {
  if (activeModel) {
    activeModel.activeMode = 'parts';
    applyViewMode(activeModel);
    updateModelSelector();
  }
});

// ---- Drag & drop (whole page) ----

document.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
document.addEventListener('dragleave', e => { dropZone.classList.remove('drag-over'); });
document.addEventListener('drop', async e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');

  // Check for folder drop (using DataTransferItem API)
  if (e.dataTransfer.items && e.dataTransfer.items.length > 0) {
    const items = Array.from(e.dataTransfer.items);
    const entries = [];
    for (const item of items) {
      const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
      if (entry) entries.push(entry);
    }

    // If any entry is a directory, read it recursively
    const hasDir = entries.some(e => e.isDirectory);
    if (hasDir) {
      statusEl.textContent = 'Reading folder...';
      const allFiles = [];
      for (const entry of entries) {
        if (entry.isDirectory) {
          await readDirectoryRecursive(entry, '', allFiles);
        } else if (entry.isFile) {
          const file = await getFileFromEntry(entry);
          if (file) allFiles.push(file);
        }
      }
      if (allFiles.length > 0) {
        handleDroppedFolderFiles(allFiles);
      }
      return;
    }
  }

  // Plain file drop
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

async function readDirectoryRecursive(dirEntry, pathPrefix, results) {
  const fullPath = pathPrefix ? pathPrefix + '/' + dirEntry.name : dirEntry.name;
  const reader = dirEntry.createReader();

  let allEntries = [];
  // readEntries may return partial results, keep reading
  let batch;
  do {
    batch = await new Promise((resolve, reject) => {
      reader.readEntries(resolve, reject);
    });
    allEntries = allEntries.concat(batch);
  } while (batch.length > 0);

  for (const entry of allEntries) {
    if (entry.isFile) {
      const file = await getFileFromEntry(entry);
      if (file) {
        // Attach relative path
        Object.defineProperty(file, 'webkitRelativePath', {
          value: fullPath + '/' + file.name,
          writable: false
        });
        results.push(file);
      }
    } else if (entry.isDirectory) {
      await readDirectoryRecursive(entry, fullPath, results);
    }
  }
}

function getFileFromEntry(entry) {
  return new Promise(resolve => {
    entry.file(f => resolve(f), () => resolve(null));
  });
}

function handleDroppedFolderFiles(files) {
  // Build file map
  const fileMap = {};
  for (const f of files) {
    const rel = f.webkitRelativePath || f.name;
    fileMap[rel] = f;
  }

  // Find manifests
  const manifestPaths = Object.keys(fileMap).filter(p => p.endsWith('/manifest.json') || p === 'manifest.json');

  if (manifestPaths.length === 0) {
    statusEl.textContent = 'No manifest.json found. Loading as plain files...';
    handleFiles(files);
    return;
  }

  statusEl.textContent = `Found ${manifestPaths.length} model(s)...`;

  let loadCount = 0;
  for (const manifestPath of manifestPaths) {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const manifest = JSON.parse(ev.target.result);
        const folderPrefix = manifestPath.replace(/manifest\.json$/, '');
        loadModelFromManifest(manifest, folderPrefix, fileMap);
      } catch(e) {
        console.error('Failed to parse manifest:', manifestPath, e);
      }
      loadCount++;
      if (loadCount === manifestPaths.length) {
        statusEl.textContent = `Loaded ${loadCount} model(s)`;
        updateModelSelector();
      }
    };
    reader.readAsText(fileMap[manifestPath]);
  }
}

// ---- Buttons ----

document.getElementById('btn-clear').addEventListener('click', () => {
  for (const e of meshEntries) {
    scene.remove(e.mesh);
    if (e.mesh.geometry) e.mesh.geometry.dispose();
    if (e.mesh.material) {
      const mats = Array.isArray(e.mesh.material) ? e.mesh.material : [e.mesh.material];
      for (const m of mats) {
        if (m.map) m.map.dispose();
        if (m.normalMap) m.normalMap.dispose();
        if (m.specularMap) m.specularMap.dispose();
        if (m.bumpMap) m.bumpMap.dispose();
        m.dispose();
      }
    }
  }
  meshEntries.length = 0;
  loadedModels.length = 0;
  activeModel = null;
  colorIdx = 0;
  meshListEl.innerHTML = '';
  updateStats();
  updateModelSelector();
});

document.getElementById('btn-show-all').addEventListener('click', () => {
  meshEntries.forEach(e => { e.mesh.visible = true; e.checkbox.checked = true; });
  updateStats();
});

document.getElementById('btn-hide-all').addEventListener('click', () => {
  meshEntries.forEach(e => { e.mesh.visible = false; e.checkbox.checked = false; });
  updateStats();
});

document.getElementById('btn-center').addEventListener('click', centerCamera);

document.getElementById('btn-wireframe').addEventListener('click', function() {
  wireframeOn = !wireframeOn;
  this.textContent = 'Wire: ' + (wireframeOn ? 'on' : 'off');
  meshEntries.forEach(e => {
    if (Array.isArray(e.mesh.material)) {
      e.mesh.material.forEach(m => { m.wireframe = wireframeOn; });
    } else {
      e.mesh.material.wireframe = wireframeOn;
    }
  });
});

document.getElementById('btn-export').addEventListener('click', exportVisibleAsFile);
document.getElementById('btn-export-clip').addEventListener('click', copyVisibleToClipboard);
</script>
